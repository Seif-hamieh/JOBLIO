<!doctype html>
<!--
  JOBLIO phone-mockup posts (1080×1350). Open in a browser to see them all; render one with ?p=<id>
  (see render.sh). Screens in shots/ come from shoot.sh (live pages). Words in 'single quotes' in a
  headline are drawn in purple.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>JOBLIO phone posts</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("../../../src/fonts/inter-latin.woff2") format("woff2");
    font-weight: 100 900;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #000; font-family: "Inter", system-ui, sans-serif; color: #fafafa; -webkit-font-smoothing: antialiased; }
  .grid { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }
  body.single .grid { padding: 0; gap: 0; }
  body.single .post:not(.on) { display: none; }

  .post {
    position: relative; width: 1080px; height: 1350px; overflow: hidden; flex: none;
    background: #060609; font-feature-settings: "cv11", "ss01", "ss03";
  }
  /* Light behind the phone: a violet core with a blue rim, plus a faint top wash. */
  .post::before {
    content: ""; position: absolute; left: 50%; top: 520px; width: 1200px; height: 1100px; transform: translateX(-50%);
    background:
      radial-gradient(closest-side, rgb(124 102 246 / 0.55), rgb(124 102 246 / 0.16) 45%, transparent 72%),
      radial-gradient(closest-side at 70% 40%, rgb(56 150 255 / 0.28), transparent 70%);
    filter: saturate(115%);
  }
  .post::after {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 520px;
    background: radial-gradient(ellipse 70% 100% at 50% 0%, rgb(124 102 246 / 0.12), transparent 70%);
  }
  .grain { position: absolute; inset: 0; opacity: 0.5; background-image: radial-gradient(rgb(255 255 255 / 0.05) 1px, transparent 1px); background-size: 4px 4px; mask-image: linear-gradient(#000, transparent 60%); }

  .head { position: relative; z-index: 2; padding: 74px 80px 0; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .label {
    display: inline-flex; align-items: center; gap: 12px; padding: 11px 22px 11px 18px; border-radius: 999px;
    border: 1.5px solid rgb(124 102 246 / 0.45); background: rgb(124 102 246 / 0.12);
    font-size: 20px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #c4b8ff;
  }
  .label i { width: 9px; height: 9px; border-radius: 50%; background: #8f7dff; box-shadow: 0 0 14px #8f7dff; }
  h1 { margin-top: 30px; font-size: var(--hs, 70px); font-weight: 800; letter-spacing: -0.045em; line-height: 1.04; max-width: 940px; text-wrap: balance; }
  h1 .v { background: linear-gradient(100deg, #a594ff, #7c66f6 60%, #6f8dff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 22px; font-size: 27px; font-weight: 500; line-height: 1.4; color: #a1a1aa; max-width: 820px; letter-spacing: -0.01em; text-wrap: balance; }

  /* Phone: titanium rim → black bezel → screen, with a Dynamic Island. Bleeds off the bottom edge. */
  .phone {
    position: absolute; z-index: 2; left: 50%; transform: translateX(-50%);
    top: var(--pt, 540px); width: 560px; height: 1180px; border-radius: 86px; padding: 6px;
    background: linear-gradient(145deg, #5b5b66, #26262d 30%, #17171c 55%, #3d3d47 80%, #1c1c22);
    box-shadow: 0 0 0 1.5px rgb(255 255 255 / 0.08), 0 50px 120px -20px rgb(0 0 0 / 0.9), 0 0 140px -10px rgb(124 102 246 / 0.45);
  }
  .bezel { width: 100%; height: 100%; border-radius: 80px; background: #000; padding: 16px; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 64px; overflow: hidden; background: #0a0a0c; }
  .screen img { display: block; width: 100%; }
  .island { position: absolute; z-index: 3; top: 16px; left: 50%; transform: translateX(-50%); width: 150px; height: 42px; border-radius: 999px; background: #000; }
  .status { position: absolute; z-index: 3; top: 22px; left: 48px; right: 44px; display: flex; justify-content: space-between; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
  .status b { display: flex; gap: 8px; align-items: center; }
  .status b span { width: 30px; height: 14px; border: 2px solid #fff; border-radius: 4px; position: relative; }
  .status b span::after { content: ""; position: absolute; inset: 1.5px; right: 5px; background: #fff; border-radius: 1.5px; }
  /* The screenshot's own top bar sits below the status bar, like a real phone. */
  .screen .page { position: absolute; top: 64px; left: 0; right: 0; }
  .side { position: absolute; width: 5px; border-radius: 3px; background: linear-gradient(#4a4a54, #2a2a31); }
  /* Bottom fade so the cut-off phone melts into the background. */
  .fade { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 330px; background: linear-gradient(transparent, rgb(6 6 9 / 0.85) 45%, #060609 72%); }
  .brand { position: absolute; z-index: 4; bottom: 46px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 30px; font-weight: 800; letter-spacing: -0.05em; }
  .brand svg { width: 32px; height: 32px; }
  .brand em { font-style: normal; font-weight: 500; font-size: 22px; color: #a1a1aa; letter-spacing: -0.01em; margin-left: 10px; padding-left: 20px; border-left: 1.5px solid #34343c; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="mark" viewBox="2.6 2.6 28.8 33.8">
    <path d="M27 6v17a8.5 8.5 0 0 1-17 0v-4" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" />
    <path d="M10 9.5 4.8 17.8h10.4Z" fill="#8f7dff" stroke="#8f7dff" stroke-width="1.6" stroke-linejoin="round" />
  </symbol>
</svg>
<div class="grid" id="grid"></div>
<script src="remote-jobs.js"></script>

<script>
  // id, label, headline ('quoted' words are purple), subtitle, screen (shots/<screen>.png)
  const POSTS = [
    ["post1", "For professionals", "Your <span class='text-purple-400'>career</span> and <span class='text-purple-400'>network</span> in one place", "Find your dream job, build your profile, and connect with top companies.", "home"],
    ["post2", "For recruiters", "Your <span class='text-purple-400'>applicants</span> and <span class='text-purple-400'>hiring pipeline</span> at a glance", "See new candidates, manage interviews, and post jobs in seconds.", "recruiters"],
  ];
  // The 10 newest open jobs on getjoblio.app/jobs?sort=newest when the shots were taken.
  const JOBS = [
    ["Solutions Engineer", "True Talent Solutions Partners", "Munich", "On-site"],
    ["Client Delivery Lead (Accounting Experience preferred) (w/f/d)", "Kraken", "Berlin, Germany", "On-site"],
    ["Senior Client Delivery Lead - GenerationFlex (w/f/d)", "Kraken", "Remote", "Remote"],
    ["Consultant (m/w/d) im Bereich Controlling / Cash-Planung", "OSCAR GmbH", "Cologne", "On-site"],
    ["Junior Consultant (m/w/d)", "OSCAR GmbH", "Cologne", "On-site"],
    ["Junior Consultant (m/w/d) im Bereich Strategie / Business Analyst", "OSCAR GmbH", "Cologne", "On-site"],
    ["Praktikum KI-Entwicklung (m/w/d)", "OSCAR GmbH", "Cologne", "On-site"],
    ["Marketing-Assistenz (m/w/d) (Minijob)", "NTI Deutschland GmbH", "Villingen-Schwenningen", "On-site"],
    ["Senior Backend Engineer", "Tala", "Remote", "Remote"],
    ["Medical Science Liaison", "Veracyte", "Remote", "Remote"],
  ];
  JOBS.forEach(([title, company, location, mode], i) => {
    const where = location === mode ? [location] : [location, mode]; // "Remote · Remote" reads as a typo
    POSTS.push([`job${i + 1}`, "Now hiring on joblio", `Job: '${title}'`, [company, ...where].join(" · "), `job${i + 1}`]);
  });

  // Remote batch (remote-jobs.js): remote1 … remote40.
  (window.REMOTE_JOBS || []).forEach(([, title, company, location, mode], i) => {
    const where = location === mode ? [location] : [location, mode];
    POSTS.push([`remote${i + 1}`, "Now hiring on joblio", `Job: '${title}'`, [company, ...where].join(" · "), `remote${i + 1}`]);
  });

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // 'quoted' → purple. An apostrophe inside a word (you'll) isn't a quote.
  // A headline written with <span class='text-purple-400'>…</span> is used as-is (only those spans are kept).
  const headline = (s) => /<span\b/.test(s)
    ? esc(s).replace(/&lt;span class=['"]text-purple-400['"]&gt;(.*?)&lt;\/span&gt;/g, '<span class="v">$1</span>')
    : esc(s).replace(/(^|[\s(])'([^']+?)'(?=$|[\s.,!?)])/g, '$1<span class="v">$2</span>');
  const now = "9:41";

  document.getElementById("grid").innerHTML = POSTS.map(([id, label, title, sub, screen]) => {
    const len = title.replace(/<[^>]+>|'/g, "").length; // visible characters only
    // Long job titles get a smaller headline. The phone is placed under the text once it is laid out.
    const hs = len > 52 ? 54 : len > 36 ? 62 : 70;
    return `
    <section class="post" data-p="${id}" style="--hs:${hs}px">
      <div class="grain"></div>
      <div class="head">
        <div class="label"><i></i>${esc(label)}</div>
        <h1>${headline(title)}</h1>
        <p class="sub">${esc(sub)}</p>
      </div>
      <div class="phone">
        <span class="side" style="left:-4px;top:210px;height:60px"></span>
        <span class="side" style="left:-4px;top:300px;height:100px"></span>
        <span class="side" style="left:-4px;top:420px;height:100px"></span>
        <span class="side" style="right:-4px;top:330px;height:150px"></span>
        <div class="bezel"><div class="screen">
          <div class="island"></div>
          <div class="status"><span>${now}</span><b>5G <span></span></b></div>
          <div class="page"><img src="shots/${screen}.png" alt="" /></div>
        </div></div>
      </div>
      <div class="fade"></div>
      <div class="brand"><svg><use href="#mark" /></svg>joblio<em>getjoblio.app</em></div>
    </section>`;
  }).join("");

  // Phone top: 64px below the subtitle, whatever the headline length.
  const place = () => document.querySelectorAll(".post").forEach((post) => {
    const head = post.querySelector(".head");
    post.style.setProperty("--pt", `${head.offsetTop + head.offsetHeight + 64}px`);
  });
  document.fonts.ready.then(place);
  place();

  const p = new URLSearchParams(location.search).get("p");
  if (p) {
    document.body.classList.add("single");
    document.querySelector(`.post[data-p="${p}"]`).classList.add("on");
  }
</script>
</body>
</html>
